<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axi IDE (FOSS Edition)</title>
    <link rel="stylesheet" href="/node_modules/xterm/css/xterm.css" />
    <link rel="stylesheet" href="/node_modules/@vscode/codicons/dist/codicon.css" />
    <style>
      body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #1e1e1e; color: #d4d4d4; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; }
      
      /* Toolbar */
      #toolbar { height: 40px; background: #333333; display: flex; align-items: center; padding: 0 15px; border-bottom: 1px solid #444; flex-shrink: 0; justify-content: space-between; }
      .toolbar-group { display: flex; align-items: center; gap: 10px; }
      button { background: #007acc; color: white; border: none; padding: 6px 15px; cursor: pointer; border-radius: 3px; font-weight: bold; }
      button:hover { background: #005f9e; }
      button:disabled { background: #555; cursor: not-allowed; }
      
      /* Main Content Area */
      #content { display: flex; flex: 1; overflow: hidden; }
      
      /* Sidebar */
      #sidebar { width: 250px; background: #252526; border-right: 1px solid #444; display: flex; flex-direction: column; }
      .sidebar-header { padding: 10px; font-size: 11px; text-transform: uppercase; font-weight: bold; color: #ccc; border-bottom: 1px solid #333; }
      #file-tree { flex: 1; overflow-y: auto; padding: 5px 0; }
      .file-node { padding: 4px 10px 4px 20px; cursor: pointer; display: flex; align-items: center; user-select: none; font-size: 13px; }
      .file-node:hover { background: #2a2d2e; }
      .file-node.selected { background: #37373d; color: #fff; }
      .file-icon { margin-right: 8px; font-size: 14px; }
      
      /* Editor Area */
      #editor-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      
      /* Tabs */
      #tabs-container { height: 35px; background: #2d2d2d; display: flex; border-bottom: 1px solid #1e1e1e; align-items: center; justify-content: space-between; }
      #tabs { display: flex; overflow-x: auto; flex: 1; height: 100%; }
      .tab { padding: 0 15px; display: flex; align-items: center; background: #2d2d2d; border-right: 1px solid #1e1e1e; cursor: pointer; font-size: 13px; min-width: 100px; color: #999; }
      .tab.active { background: #1e1e1e; color: #fff; border-top: 1px solid #007acc; }
      .tab-close { margin-left: 10px; opacity: 0.5; cursor: pointer; }
      .tab-close:hover { opacity: 1; color: #f44336; }
      
      #editor-actions { display: flex; gap: 5px; padding-right: 15px; }
      #editor-actions button { background: transparent; color: #ccc; border: 1px solid #444; padding: 4px 10px; cursor: pointer; border-radius: 3px; font-size: 11px; font-weight: bold; }
      #editor-actions button:hover:not(:disabled) { background: #444; color: #fff; }
      #editor-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
      
      #editor-container { flex: 1; width: 100%; position: relative; }
      
      /* Terminal Area */
      #terminal-panel { height: 250px; background: #1e1e1e; border-top: 1px solid #444; display: flex; flex-direction: column; }
      .terminal-header { height: 30px; background: #2d2d2d; display: flex; align-items: center; padding: 0 15px; font-size: 12px; font-weight: bold; }
      #terminal-container { flex: 1; padding: 10px; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <div class="toolbar-group">
        <button id="openFolderBtn"><i class="codicon codicon-folder-opened"></i> Open Folder</button>
      </div>
      <div class="toolbar-group">
        <span id="status" style="font-size: 13px; color: #aaa;">Ready</span>
      </div>
    </div>
    <div id="content">
      <div id="sidebar">
        <div class="sidebar-header">Explorer</div>
        <div id="file-tree"></div>
      </div>
      <div id="editor-area">
        <div id="tabs-container">
          <div id="tabs"></div>
          <div id="editor-actions">
            <button id="compileBtn" disabled><i class="codicon codicon-play"></i> Compile to Safe C</button>
            <button id="runBtn" disabled><i class="codicon codicon-terminal"></i> Run</button>
          </div>
        </div>
        <div id="editor-container"></div>
        <div id="terminal-panel">
          <div class="terminal-header">Terminal / Output</div>
          <div id="terminal-container"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
