name: Proof Battery (mac-arm64)
on: [push, pull_request]
jobs:
  battery:
    runs-on: [self-hosted, macOS, arm64]
    steps:
      - name: Assert Hardware Match
        run: |
          if [ "${{ runner.arch }}" != "ARM64" ] || [ "${{ runner.os }}" != "macOS" ]; then
            echo "Runner architecture mismatch. Cannot run mac-arm64 tests on this hardware."
            exit 1
          fi
      - name: Checkout FOSS Tree
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch Battery scripts
        run: |
          curl -sSL https://forge.the-ethos-project.com/install.sh -o install.sh
          chmod +x install.sh
      - name: Run Install Battery
        run: |
          ./install.sh
      - name: Run Smoke Test
        run: |
          echo 'WRITE "Hello from Axos!" TO SCREEN' > hello.axos
          axos hello.axos
      - name: Run Package Battery
        run: |
          allforge install test.sample_private
          allforge update test.sample_private
          allforge remove test.sample_private
